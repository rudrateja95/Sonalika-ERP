<!DOCTYPE html>
<html>
<head>
<style>


.left{
    width:75mm;      /* Increase from the current value */
}

.right{
    width:7mm;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-left: 0mm;
}

.tag-table{
    width:100%;
    margin-top: 0.5mm;
    margin-left: 0mm;
}

.tag-table td{
    padding:1px;
}
@page{
    size:50mm 12mm;
    margin:0;
}

html,body{
    margin:0;
    padding:0;
}

#labels{
    width:50mm;
margin-left: 0%;
}

.tag-label{
    width:50mm;
    height:12mm;
    display:flex;
    align-items:center;
    font-family: Tahoma, sans-serif;
    font-size:7px;
    box-sizing:border-box;
    page-break-after:always;
    font-weight: 600;
}
</style>
</head>
<body>

<!-- Only your label -->
<div id="labels"></div>

<script>

const tags = JSON.parse(localStorage.getItem("printTags")) || [];

const container = document.getElementById("labels");

tags.forEach(item => {

    container.innerHTML += `
        <div class="tag-label">

            <div class="left">

                <table class="tag-table">

                    <tr align="center" style="width:24.5mm">
                        <td>TAG<br>${item.tag}</td>
                        <td>G.WT<br>${item.gross}</td>
                        <td>D.WT<br>${item.diawt}</td>
                        <td>S.WT<br>${item.stonewt}</td>
                        <td>PTY<br>${item.purity}</td>
                        
                    </tr>

                    <tr align="center">
                        <td>DGN<br>${item.design}</td>
                        <td>N.WT<br>${item.net}</td>
                        <td>D.PC<br>${item.diapc}</td>
                        <td>S.PC<br>${item.stonepc}</td>
                        <td>D.Cty<br>${item.clarity}-${item.color}</td>
                        
                    </tr>

                </table>

            </div>

            <div class="right">
                <img src="/static/img-land/Sonalikaicon2.png"
                     style="width:8mm;height:auto;">
            </div>

        </div>
    `;

});

window.onload = function () {
    setTimeout(function () {
        window.print();
    }, 500);
};

</script>
</body>
</html>
