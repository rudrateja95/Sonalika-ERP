    <script>

        // =========================
        // Selected Category
        // =========================
        const category = new URLSearchParams(window.location.search).get("category") || "SJ";

        // =========================
        // Variables
        // =========================
        let rowTemplate;
        let nextTagNo = 1;

        // =========================
        // Get Next Tag Number From DB
        // =========================
        async function loadNextTagNumber() {

            const res = await fetch(`/api/next-tag-no?category=${category}`);
            const result = await res.json();

            if (result.success) {
                nextTagNo = result.next_no;
            } else {
                nextTagNo = 1;
            }
        }
        // =========================
        // Add New Row
        // =========================
        function addRow() {

            const tbody = document.getElementById("tagTable");

            const newRow = rowTemplate.cloneNode(true);

            // Clear Inputs
            newRow.querySelectorAll("input").forEach(input => {

                if (input.type !== "hidden") {
                    input.value = "";
                }

            });

            // Reset Selects
            newRow.querySelectorAll("select").forEach(select => {
                select.selectedIndex = 0;
            });

            // Assign Tag Number
            const tagInput = newRow.querySelector(".tagNo");
            tagInput.value = `${category}-${nextTagNo}`;

            // Increase for next row
            nextTagNo++;

            tbody.appendChild(newRow);

        }

        // =========================
        // Remove Row
        // =========================
        function removeThisRow(btn) {

            const tbody = document.getElementById("tagTable");

            if (tbody.rows.length > 1) {

                btn.closest("tr").remove();

            } else {

                alert("At least one row must remain.");

            }

        }

        // =========================
        // Page Load
        // =========================
        document.addEventListener("DOMContentLoaded", async function () {

            rowTemplate = document.querySelector("#tagTable tr").cloneNode(true);

            document.getElementById("tagTable").innerHTML = "";

            // Get starting number from database
            await loadNextTagNumber();

            // Load Draft
            await loadDraft();

            // If no draft, create first row
            if (document.querySelectorAll("#tagTable tr").length === 0) {

                addRow();

            }

        });

        // =========================
        // Enter Key
        // =========================
        document.addEventListener("keydown", async function (e) {

            if (e.key !== "Enter") return;

            if (!e.target.classList.contains("netWt")) return;

            e.preventDefault();

            const row = e.target.closest("tr");

            await saveDraftRow(row);

            const tbody = document.getElementById("tagTable");

            if (row === tbody.rows[tbody.rows.length - 1]) {

                addRow();

            }

            tbody.rows[tbody.rows.length - 1]
                .querySelector(".designNo")
                .focus();

        });

        // =========================
        // Disable Mouse Wheel
        // =========================
        document.addEventListener("wheel", function (e) {

            if (document.activeElement.type === "number") {

                e.preventDefault();

            }

        }, { passive: false });

        // =========================
        // Calculate Net Weight
        // =========================
        function calculateNetWt(input) {

            const row = input.closest("tr");

            const grossWt = parseFloat(row.querySelector(".grossWt").value) || 0;
            const diaWt = parseFloat(row.querySelector(".diaWt").value) || 0;
            const stoneWt = parseFloat(row.querySelector(".stoneWt").value) || 0;

            const netWt = grossWt - ((diaWt + stoneWt) / 5);

            row.querySelector(".netWt").value = netWt.toFixed(3);

        }

    </script>

<script>

    // =========================
    // Save Draft Row
    // =========================
    function saveDraftRow(row) {

        const data = {
            tag_no: row.querySelector(".tagNo").value,
            design_no: row.querySelector(".designNo").value,

            gold_purity: row.cells[2].querySelector("select").value,
            diamond_clarity: row.cells[3].querySelector("select").value,
            diamond_color: row.cells[4].querySelector("select").value,

            gold_weight: parseFloat(row.querySelector(".grossWt").value) || 0,
            diamond_weight: parseFloat(row.querySelector(".diaWt").value) || 0,
            diamond_pieces: parseInt(row.querySelector(".diaPc").value) || 0,

            dia_pc_2: parseInt(row.dataset.diaPc2) || 0,
            dia_wt_2: parseFloat(row.dataset.diaWt2) || 0,

            dia_pc_6_5: parseInt(row.dataset.diaPc6_5) || 0,
            dia_wt_6_5: parseFloat(row.dataset.diaWt6_5) || 0,

            dia_pc_11: parseInt(row.dataset.diaPc11) || 0,
            dia_wt_11: parseFloat(row.dataset.diaWt11) || 0,

            igi_no: row.dataset.diaIgiNo || "",
            huid_no: row.dataset.diaHuidNo || "",

            stone_weight: parseFloat(row.querySelector(".stoneWt").value) || 0,
            stone_pieces: parseInt(row.cells[9].querySelector("input").value) || 0,

            net_weight: parseFloat(row.querySelector(".netWt").value) || 0
        };

        fetch("/api/tag-draft/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(result => {
                console.log("Draft Saved:", result);
            })
            .catch(err => {
                console.error(err);
            });

    }


    // =========================
    // Load Draft
    // =========================
    async function loadDraft() {

        try {

            const res = await fetch("/api/tag-draft");
            const result = await res.json();

            const tbody = document.getElementById("tagTable");

            tbody.innerHTML = "";

            if (!result.success || result.data.length === 0) {

                addRow();
                return;

            }

            result.data.forEach(item => {

                addRow();

                const row = tbody.rows[tbody.rows.length - 1];

                row.querySelector(".tagNo").value = item.tag_no || "";
                row.querySelector(".designNo").value = item.design_no || "";

                row.cells[2].querySelector("select").value = item.gold_purity || "18KT";
                row.cells[3].querySelector("select").value = item.diamond_clarity || "VVS";
                row.cells[4].querySelector("select").value = item.diamond_color || "EF";

                row.querySelector(".grossWt").value = item.gold_weight || 0;
                row.querySelector(".diaWt").value = item.diamond_weight || 0;
                row.querySelector(".diaPc").value = item.diamond_pieces || 0;

                row.dataset.diaPc2 = item.dia_pc_2 || 0;
                row.dataset.diaWt2 = item.dia_wt_2 || 0;

                row.dataset.diaPc6_5 = item.dia_pc_6_5 || 0;
                row.dataset.diaWt6_5 = item.dia_wt_6_5 || 0;

                row.dataset.diaPc11 = item.dia_pc_11 || 0;
                row.dataset.diaWt11 = item.dia_wt_11 || 0;

                row.dataset.diaIgiNo = item.igi_no || "";
                row.dataset.diaHuidNo = item.huid_no || "";

                row.querySelector(".stoneWt").value = item.stone_weight || 0;
                row.cells[9].querySelector("input").value = item.stone_pieces || 0;

                row.querySelector(".netWt").value = item.net_weight || 0;

            });

            // Always keep one empty row for new entry
            addRow();

        } catch (err) {

            console.error(err);

            addRow();

        }

    }

</script>
<!-- key board Functions -->
<script>

    let suppressEnterKeyUp = false;

    function getCellNav(current) {

        const row = current.closest("tr");

        const rows = [...document.querySelectorAll("#tagTable tr")];
        const rowIndex = rows.indexOf(row);

        const cols = [...row.querySelectorAll(".cell")];
        const colIndex = cols.indexOf(current);

        return { row, rows, rowIndex, cols, colIndex };
    }

    function moveToNextCell(current) {

        const { rows, rowIndex, cols, colIndex } = getCellNav(current);

        let target = null;

        // Move to next column
        if (colIndex < cols.length - 1) {
            target = cols[colIndex + 1];
        }
        // Move to first column of next row
        else if (rowIndex < rows.length - 1) {
            target = rows[rowIndex + 1].querySelectorAll(".cell")[0];
        }
        // Last cell of last row -> create new row
        else {

            addRow();   // Replace with your row creation function

            const newRows = [...document.querySelectorAll("#tagTable tr")];
            const newRow = newRows[newRows.length - 1];

            target = newRow.querySelectorAll(".cell")[0];
        }

        if (target) {

            // Always suppress a trailing Enter keyup landing on a select,
            // no matter what triggered this move (outer Enter or dropdown "change")
            if (target.tagName === "SELECT") {
                suppressEnterKeyUp = true;
            }

            target.focus();
            target.select?.();
        }

    }

    // =========================
    // Enter / Arrow navigation for text & number inputs
    // =========================
    document.addEventListener("keydown", function (e) {

        if (!e.target.classList.contains("cell")) return;

        const current = e.target;
        const isSelect = current.tagName === "SELECT";

        const { rows, rowIndex, cols, colIndex } = getCellNav(current);

        let target = null;

        switch (e.key) {

            case "Enter":
                // For selects, let the native "change" event handle advancing
                if (isSelect) return;

                e.preventDefault();
                moveToNextCell(current);
                return;

            case "ArrowRight":
                e.preventDefault();
                if (colIndex < cols.length - 1) {
                    target = cols[colIndex + 1];
                }
                break;

            case "ArrowLeft":
                e.preventDefault();
                if (colIndex > 0) {
                    target = cols[colIndex - 1];
                }
                break;

            case "ArrowDown":
                if (isSelect) return;

                e.preventDefault();
                if (rowIndex < rows.length - 1) {
                    target = rows[rowIndex + 1].querySelectorAll(".cell")[colIndex];
                }
                break;

            case "ArrowUp":
                if (isSelect) return;

                e.preventDefault();
                if (rowIndex > 0) {
                    target = rows[rowIndex - 1].querySelectorAll(".cell")[colIndex];
                }
                break;
        }

        if (target) {
            target.focus();
            target.select?.();
        }

    });

    // =========================
    // Suppress the trailing Enter keyup on a newly-focused select
    // =========================
    document.addEventListener("keyup", function (e) {

        if (e.key !== "Enter") return;
        if (!suppressEnterKeyUp) return;

        e.preventDefault();
        suppressEnterKeyUp = false;

    }, true); // capture phase — runs before the select's own native handling

    // =========================
    // Auto-advance selects on selection (keyboard or mouse)
    // =========================
    document.addEventListener("change", function (e) {

        if (!e.target.classList.contains("cell")) return;
        if (e.target.tagName !== "SELECT") return;

        moveToNextCell(e.target);

    });

</script>

                row.dataset.diaPc11 = item.dia_pc_11 || 0;
                row.dataset.diaWt11 = item.dia_wt_11 || 0;

                row.dataset.diaIgiNo = item.igi_no || "";
                row.dataset.diaHuidNo = item.huid_no || "";

                row.querySelector(".stoneWt").value = item.stone_weight || 0;
                row.cells[9].querySelector("input").value = item.stone_pieces || 0;

                row.querySelector(".netWt").value = item.net_weight || 0;

            });

            // Always keep one empty row for new entry
            addRow();

        } catch (err) {

            console.error(err);

            addRow();

        }

    }

</script>

<!-- Diamond Selection Modal Logic -->
<script>

    let activeDiaRow = null;
    let skipDiaModalOnce = false;

    const diamondModalEl = document.getElementById('diamondModal');
    const diamondModal = new bootstrap.Modal(diamondModalEl);

    const sizeMap = {
        "-2.0": "2",
        "-6.5": "6_5",
        "-11": "11"
    };

    // =========================
    // Trigger: click on Diamond Weight cell
    // =========================
    document.addEventListener("focusin", function (e) {

        if (!e.target.classList.contains("diaWt")) return;

        if (skipDiaModalOnce) {
            skipDiaModalOnce = false;
            return;
        }

        activeDiaRow = e.target.closest("tr");
        openDiamondModal();

    });

    // =========================
    // Trigger: Enter key on Diamond Weight cell
    // =========================
    document.addEventListener("keydown", function (e) {

        if (e.key !== "Enter") return;
        if (!e.target.classList.contains("diaWt")) return;

        e.preventDefault();

        activeDiaRow = e.target.closest("tr");
        openDiamondModal();

    });

    // =========================
    // Open Modal (auto-render saved values)
    // =========================
    function openDiamondModal() {

        document.querySelectorAll("#diamondRowsBody tr").forEach(row => {

            const key = sizeMap[row.dataset.size];

            const pc = activeDiaRow ? (activeDiaRow.dataset["diaPc" + key] || "") : "";
            const wt = activeDiaRow ? (activeDiaRow.dataset["diaWt" + key] || "") : "";

            row.querySelector(".diaPieces").value   = pc;
            row.querySelector(".diaRowTotal").value = wt;

        });

        // IGI/HUID are single values per row (not per size)
        document.getElementById("diaIgiNo").value  = activeDiaRow ? (activeDiaRow.dataset.diaIgiNo  || "") : "";
        document.getElementById("diaHuidNo").value = activeDiaRow ? (activeDiaRow.dataset.diaHuidNo || "") : "";

        updateDiamondTotals();
        diamondModal.show();

        diamondModalEl.addEventListener("shown.bs.modal", function focusFirst() {
            document.querySelector("#diamondRowsBody .diaPieces").focus();
            diamondModalEl.removeEventListener("shown.bs.modal", focusFirst);
        });

    }

    // =========================
    // Recalculate Totals (footer)
    // =========================
    function updateDiamondTotals() {

        let totalPc = 0;
        let totalWt = 0;

        document.querySelectorAll("#diamondRowsBody tr").forEach(row => {
            totalPc += parseFloat(row.querySelector(".diaPieces").value) || 0;
            totalWt += parseFloat(row.querySelector(".diaRowTotal").value) || 0;
        });

        document.getElementById("diaTotalPc").textContent = totalPc;
        document.getElementById("diaTotalWt").textContent = totalWt.toFixed(3);

    }

    // =========================
    // Save — write back to main row, close modal
    // =========================
    function saveDiamondModal() {

        if (activeDiaRow) {

            const rows = [...document.querySelectorAll("#diamondRowsBody tr")];

            rows.forEach(r => {
                const size = r.dataset.size;
                const key = sizeMap[size];

                const pc = parseInt(r.querySelector(".diaPieces").value) || 0;
                const wt = parseFloat(r.querySelector(".diaRowTotal").value) || 0;

                activeDiaRow.dataset["diaPc" + key] = pc;
                activeDiaRow.dataset["diaWt" + key] = wt;
            });

            // Save single IGI/HUID values on the main row
            activeDiaRow.dataset.diaIgiNo  = document.getElementById("diaIgiNo").value.trim();
            activeDiaRow.dataset.diaHuidNo = document.getElementById("diaHuidNo").value.trim();

            activeDiaRow.querySelector(".diaWt").value = document.getElementById("diaTotalWt").textContent;
            activeDiaRow.querySelector(".diaPc").value = document.getElementById("diaTotalPc").textContent;

            calculateNetWt(activeDiaRow.querySelector(".diaWt"));

        }

        diamondModal.hide();

    }

    // =========================
    // After modal closes -> move cursor to Stone Weight
    // =========================
    diamondModalEl.addEventListener("hidden.bs.modal", function () {

        if (!activeDiaRow) return;

        skipDiaModalOnce = true;

        const stoneWtInput = activeDiaRow.querySelector(".stoneWt");

        if (stoneWtInput) {
            stoneWtInput.focus();
            stoneWtInput.select?.();
        }

    });

    // =========================
    // Modal Keyboard Navigation — now spans size rows, then IGI No, then HUID No, then save
    // =========================
    document.addEventListener("keydown", function (e) {

        if (!e.target.classList.contains("diaModalCell")) return;
        if (e.key !== "Enter") return;

        e.preventDefault();

        // All navigable cells in document order: 3 rows x 2 cells, then IGI No, then HUID No
        const allCells = [
            ...document.querySelectorAll("#diamondRowsBody .diaModalCell"),
            document.getElementById("diaIgiNo"),
            document.getElementById("diaHuidNo")
        ];

        const currentIndex = allCells.indexOf(e.target);
        if (currentIndex === -1) return;

        if (currentIndex < allCells.length - 1) {
            const target = allCells[currentIndex + 1];
            target.focus();
            target.select?.();
        } else {
            // Last field (HUID No) -> save and close
            saveDiamondModal();
        }

    });

</script>

<script>
    function printAllTags() {

        const rows = document.querySelectorAll("#tagTable tr");

        let tags = [];

        rows.forEach(row => {

            tags.push({
                tag: row.cells[0].querySelector("input").value,
                design: row.cells[1].querySelector("input").value,
                purity: row.cells[2].querySelector("select").value,
                clarity: row.cells[3].querySelector("select").value,
                color: row.cells[4].querySelector("select").value,
                gross: row.cells[5].querySelector("input").value,
                diawt: row.cells[6].querySelector("input").value,
                diapc: row.cells[7].querySelector("input").value,
                igi: row.dataset.diaIgiNo || "",
                huid: row.dataset.diaHuidNo || "",
                stonewt: row.cells[8].querySelector("input").value,
                stonepc: row.cells[9].querySelector("input").value,
                net: row.cells[10].querySelector("input").value
            });

        });

        // Save data for print page
        localStorage.setItem("printTags", JSON.stringify(tags));

        // Save into database first
        fetch("/save-print-tags", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                tags: tags
            })
        })
            .then(response => response.json())
            .then(data => {

                if (data.success) {

                    window.open("/print-tag");

                } else {

                    alert(data.message);

                }

            })
            .catch(error => {

                console.log(error);

                alert("Unable to save tags.");

            });

    }
</script>
